[package]
name = "devkit"
version = "0.1.1"
description = "Alt+Space 唤起的开发者工具箱"
authors = ["caiyq925-cell"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "gzip", "json"] }
arboard = "3"
whoami = "1"
base64 = "0.22"
netdev = "0.36"

[target."cfg(windows)".dependencies]
winreg = "0.56"
lnk = "0.6"
encoding_rs = "0.8"
